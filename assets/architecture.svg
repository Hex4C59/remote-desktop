<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="980" viewBox="0 0 1160 980" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">远程桌面目标架构</title>
  <desc id="arch-desc">M1 目标架构：Android Java 控制端与 Windows 用户会话代理，通过 Go WSS 控制面协调授权、恢复与续期，WebRTC 优先直连并以 coturn 中继。会话状态串行处理，采集、输入与统计分别调度，持帧任务结束后完成资源释放。Linux 移植代码尚待主干验收。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1160" height="980" fill="#f6f8fb"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">
    <text x="580" y="30" text-anchor="middle" font-size="17" font-weight="600">远程桌面目标架构 · M1 待实现与验收</text>

    <rect x="100" y="56" width="960" height="212" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
    <text x="124" y="86" font-size="17" font-weight="600">控制端 · Android 前台应用（Java）</text>
    <rect x="140" y="116" width="170" height="44" rx="8" fill="#e8f1ff" stroke="#8fb4e8"/>
    <text x="225" y="138" text-anchor="middle" dominant-baseline="central" fill="#163a66">UI / 能力与状态</text>
    <rect x="350" y="116" width="240" height="44" rx="8" fill="#dce9ff" stroke="#6f9ee0"/>
    <text x="470" y="138" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#163a66">SessionController</text>
    <rect x="650" y="100" width="360" height="44" rx="8" fill="#eafaf1" stroke="#5fc08a"/>
    <text x="830" y="122" text-anchor="middle" dominant-baseline="central" fill="#145c34">MediaClient / 原生 Renderer</text>
    <rect x="650" y="160" width="360" height="44" rx="8" fill="#e8f1ff" stroke="#8fb4e8"/>
    <text x="830" y="182" text-anchor="middle" dominant-baseline="central" fill="#163a66">InputController / 按压状态</text>
    <line x1="310" y1="138" x2="342" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 590 138 H 620 V 122 H 642" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 138 V 182 H 642" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="230" fill="#475569">命令与状态分开；视频帧走原生渲染接口；测量最多 2 个在途持帧任务</text>
    <text x="140" y="251" font-size="12.5" fill="#475569">先停止收帧并等待持帧任务结束，再释放相关媒体与 EGL 资源</text>

    <rect x="100" y="360" width="420" height="212" rx="16" fill="#fff8ec" stroke="#f0b45f" stroke-width="1.5"/>
    <text x="124" y="392" font-size="17" font-weight="600" fill="#7a4a12">控制面 · Go / WSS</text>
    <text x="124" y="432">持钥认证 / 稳定设备身份 / 在线状态</text>
    <text x="124" y="464">本地授权确认 / 能力与权限 / 信令</text>
    <text x="124" y="496">恢复协调 / token 与 TURN 凭据续发</text>
    <text x="124" y="542" font-size="12.5" fill="#8a6a3a">凭据经 WSS 发往两端；不转发画面</text>

    <rect x="640" y="360" width="420" height="212" rx="16" fill="#eafaf1" stroke="#5fc08a" stroke-width="1.5"/>
    <text x="664" y="392" font-size="17" font-weight="600" fill="#145c34">媒体面 · WebRTC / coturn</text>
    <text x="664" y="432">ICE 选择直连或 TURN 中继路径</text>
    <text x="664" y="464">DTLS-SRTP 视频 / SCTP over DTLS 输入</text>
    <text x="664" y="496">两端应用新 TURN 凭据后再使用新配置</text>
    <text x="664" y="542" font-size="12.5" fill="#2f7a52">M1 TURN：UDP/TCP 3478 + 可达 relay 端口</text>

    <path d="M 470 268 V 308 H 310 V 352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="305" y="294" font-size="12.5" fill="#475569">WSS · 授权 / 恢复 / 续期</text>
    <path d="M 980 268 V 352" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="958" y="324" text-anchor="end" font-size="12.5" fill="#475569">视频 + DataChannel</text>

    <rect x="100" y="676" width="960" height="244" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
    <text x="124" y="706" font-size="17" font-weight="600">被控端 · Windows 已登录、未锁屏的用户会话代理</text>
    <rect x="140" y="756" width="170" height="44" rx="8" fill="#e8f1ff" stroke="#8fb4e8"/>
    <text x="225" y="778" text-anchor="middle" dominant-baseline="central" fill="#163a66">本地授权 / 结束入口</text>
    <rect x="350" y="756" width="240" height="44" rx="8" fill="#dce9ff" stroke="#6f9ee0"/>
    <text x="470" y="778" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#163a66">SessionController</text>
    <rect x="650" y="736" width="360" height="44" rx="8" fill="#eafaf1" stroke="#5fc08a"/>
    <text x="830" y="758" text-anchor="middle" dominant-baseline="central" fill="#145c34">采集 / 编码 · 有界待处理帧</text>
    <rect x="650" y="796" width="360" height="44" rx="8" fill="#e8f1ff" stroke="#8fb4e8"/>
    <text x="830" y="818" text-anchor="middle" dominant-baseline="central" fill="#163a66">InputService · 独立串行执行</text>
    <line x1="310" y1="778" x2="342" y2="778" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 590 778 H 620 V 758 H 642" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 620 778 V 818 H 642" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="870" fill="#475569">公共 C++：协议 / 桌面会话 / 帧接口 / 统计；DXGI、输入与桌面权限由平台适配</text>
    <text x="140" y="897" font-size="12.5" fill="#475569">状态串行；统计后台写盘；撤权先停输入；资源释放完成后才开放新会话</text>

    <path d="M 470 676 V 632 H 310 V 580" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="608" font-size="12.5" fill="#475569">注册 / 授权 / 被控端发起协商</text>
    <path d="M 980 676 V 580" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="958" y="644" text-anchor="end" font-size="12.5" fill="#475569">视频 + DataChannel</text>
    <text x="580" y="953" text-anchor="middle" font-size="12.5" fill="#475569">Linux Xorg 已有移植代码，主干待验收；完整 JNI 运行时、系统服务与新 UI 栈分别评估</text>
  </g>
</svg>
